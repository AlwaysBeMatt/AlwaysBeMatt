<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="AlwaysBeMatt - Anime, Coding, Gaming">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14111D"/>
      <stop offset="1" stop-color="#261E40"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#B4A5F0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#B4A5F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#7FD8B5" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7FD8B5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9E6F5"/>
      <stop offset="1" stop-color="#B4A5F0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#glowA)"/>
  <rect width="1200" height="260" rx="18" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#3A3156" stroke-width="2"/>

  <!-- small stars -->
  <g fill="#E9E6F5">
    <circle cx="640" cy="48" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="210" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="70" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="200" r="1.6"><animate attributeName="opacity" values="1;0.25;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="225" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="30" r="1.4"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- four point sparkles -->
  <path d="M1010 50 Q1010 100 1060 100 Q1010 100 1010 150 Q1010 100 960 100 Q1010 100 1010 50 Z" fill="#B4A5F0" opacity="0.9"/>
  <path d="M1105 70 Q1105 88 1123 88 Q1105 88 1105 106 Q1105 88 1087 88 Q1105 88 1105 70 Z" fill="#E3BC72">
    <animate attributeName="opacity" values="1;0.35;1" dur="3.4s" repeatCount="indefinite"/>
  </path>
  <path d="M930 175 Q930 187 942 187 Q930 187 930 199 Q930 187 918 187 Q930 187 930 175 Z" fill="#7FD8B5">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- text -->
  <text x="70" y="92" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="20" fill="#E3BC72" letter-spacing="2">// D3 Teknologi Informasi</text>
  <text x="66" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="700" fill="url(#title)">AlwaysBeMatt</text>
  <rect x="70" y="188" width="64" height="3" rx="1.5" fill="#E3BC72"/>
  <text x="70" y="226" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="24" fill="#7FD8B5" letter-spacing="3">Anime  |  Coding  |  Gaming</text>
</svg>
