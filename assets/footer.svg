<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="See you in the next adventure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14111D"/>
      <stop offset="0.5" stop-color="#261E40"/>
      <stop offset="1" stop-color="#14111D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#B4A5F0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#B4A5F0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="110" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="110" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="108" rx="17" fill="none" stroke="#3A3156" stroke-width="2"/>

  <g fill="#E9E6F5">
    <circle cx="180" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="80" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="28" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="78" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M600 14 Q600 24 610 24 Q600 24 600 34 Q600 24 590 24 Q600 24 600 14 Z" fill="#E3BC72"/>

  <text x="600" y="64" text-anchor="middle" font-family="'Segoe UI','Noto Sans JP','Yu Gothic',Arial,sans-serif" font-size="26" font-weight="600" fill="#E9E6F5">またね！See you in the next adventure</text>
  <text x="600" y="90" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="14" fill="#8C86A8" letter-spacing="3">AlwaysBeMatt</text>
</svg>
